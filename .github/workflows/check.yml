name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile collector.py codex_limits.py claude_limits.py install.py demo.py tools/update_catalog.py tools/update_go_pricing.py tools/pricing_gaps.py
      - run: bash -n launch.sh refresh.sh notify-resets.sh go-collector.sh install.sh
